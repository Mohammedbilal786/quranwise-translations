name: check translations

# The app fetches these files straight from this repo over jsdelivr, so a bad
# push ships to every reader. This is the gate that was missing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only -- no install step needed.
      - name: Validate every edition
        run: python3 tools/qwt.py check

      - name: Confirm nothing needs normalising
        run: |
          python3 tools/qwt.py normalise --dry-run
          git diff --exit-code -- translations/
